name: DroidFixAutomator Windows Release CI/CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Standalone Windows Executable & Create GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller pytest customtkinter pyqt6
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Execute Full Diagnostic Unit Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Compile Standalone Windows Executable via PyInstaller
        run: |
          python build_compiler.py

      - name: Package Portable ZIP Installer
        run: |
          python build_master_installer.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/SusetoDroidFixMasterCockpit.exe
            Output/SusetoFix_Portable_Installer.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
